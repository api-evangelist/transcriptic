name: Transcriptic
description: >-
  Transcriptic is a robotic cloud laboratory for the life sciences, now operating as
  Strateos following a merger with 3Scan. It lets researchers design, submit and run
  wet-lab biology experiments remotely on automated robotic infrastructure: experiments
  are specified in Autoprotocol (an open JSON standard) and submitted to a
  JSON:API-compliant REST API at https://secure.strateos.com, where organizations,
  projects, runs, datasets, containers and aliquots are managed programmatically and the
  resulting datasets are fetched back for analysis. Transcriptic publishes an official
  Python client library and command-line interface (TxPy, `pip install transcriptic`),
  with Jupyter-notebook integration, and was backed by GV.
